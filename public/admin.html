<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - YashiraFarm</title>
    <link rel="icon" type="image/webp" href="/yashirafarm-webp.webp">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #0F4D43; --primary-dark: #09332c; --accent: #F9B823; --danger: #c62828; --success: #2e7d32; --bg: #f8f9fa; --text: #333; --text-light: #666; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: var(--primary); margin-bottom: 8px; }
        .sub { color: var(--text-light); margin-bottom: 24px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; border-top: 4px solid var(--primary); }
        .card h2 { font-size: 18px; margin-bottom: 16px; color: var(--primary); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 4px; }
        .form-group textarea, .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: inherit; }
        .form-group textarea:focus, .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--accent); color: #000; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
        th { background: #f5f5f5; font-weight: 600; color: var(--text-light); }
        .status-active { color: var(--success); font-weight: 700; }
        .status-blocked { color: var(--danger); font-weight: 700; }
        .logout { background: #ffebee; color: var(--danger); border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-bottom: 16px; }
        .success-msg { background: #e8f5e9; color: var(--success); padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
        .badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
        .badge-aktif { background: #e8f5e9; color: var(--success); }
        .badge-pasif { background: #ffebee; color: var(--danger); }
        .btn-group { display: flex; gap: 4px; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👑 Admin Panel</h1>
        <p class="sub">Kelola pengguna, pengaturan aplikasi, dan pop-up</p>
        <button class="logout" id="btnLogout">🚪 Logout</button>
        <div class="success-msg" id="successMsg"></div>

        <div class="card">
            <h2>📝 Edit Teks Suspend</h2>
            <div class="form-group"><textarea id="suspendMessage" rows="3"></textarea></div>
            <button class="btn btn-primary" id="btnSaveMessage">Simpan Teks</button>
        </div>

        <div class="card">
            <h2>📢 Pengaturan Pop-up Informasi</h2>
            <div class="form-group">
                <label>Status Pop-up</label>
                <select id="popupActive">
                    <option value="false">Mati (Tidak Tampil)</option>
                    <option value="true">Nyala (Tampil di Landing Page)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Link Gambar Iklan (URL)</label>
                <!-- Input ini diganti menjadi teks URL, bukan upload file -->
                <input type="text" id="popupImageUrl" placeholder="https://raw.githubusercontent.com/.../gambar.webp">
                <div id="currentImagePreview" style="margin-top: 10px; font-size: 12px; color: #666;"></div>
            </div>
            <div class="form-group">
                <label>Link Tujuan (Jika iklan diklik)</label>
                <input type="text" id="popupLink" placeholder="https://wa.me/... atau https://t.me/...">
            </div>
            <button class="btn btn-primary" id="btnSavePopup">Simpan Pengaturan Popup</button>
        </div>

        <div class="card">
            <h2>👥 Daftar Pengguna & Aktivitas</h2>
            <div style="overflow-x:auto;">
                <table id="userTable">
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Nama</th>
                            <th>Status</th>
                            <th>Aktivitas</th>
                            <th>Terakhir Aktif</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function apiCall(endpoint, method = 'GET', body = null) {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(endpoint, opts);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Terjadi kesalahan');
            return data;
        }

        function showSuccess(msg) { const el = document.getElementById('successMsg'); el.textContent = msg; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 3000); }

        function formatTanggal(tglString) {
            if (!tglString) return '-';
            const d = new Date(tglString);
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        async function loadUsers() {
            try {
                const data = await apiCall('/api/admin/users');
                const tbody = document.querySelector('#userTable tbody');
                tbody.innerHTML = (data.users || []).map(u => {
                    const isAktif = u.total_transaksi > 0;
                    const badgeClass = isAktif ? 'badge-aktif' : 'badge-pasif';
                    const badgeText = isAktif ? '📝 Aktif' : '💤 Pasif';
                    return `
                    <tr>
                        <td>${u.email}</td>
                        <td>${u.nama || '-'}</td>
                        <td class="status-${u.status}">${u.status === 'active' ? '✅ Aktif' : '🚫 Diblokir'}</td>
                        <td style="text-align:center;"><span class="badge ${badgeClass}">${u.total_transaksi} trx</span> ${badgeText}</td>
                        <td>${formatTanggal(u.aktivitas_terakhir)}</td>
                        <td>
                            <div class="btn-group">
                                ${u.status === 'active' 
                                    ? `<button class="btn btn-danger btn-sm" onclick="ubahStatus('${u.id}', 'blocked')">Blokir</button>`
                                    : `<button class="btn btn-success btn-sm" onclick="ubahStatus('${u.id}', 'active')">Buka</button>`
                                }
                                <button class="btn btn-warning btn-sm" onclick="hapusDataMember('${u.id}', '${u.nama || u.email}')">Hapus Data</button>
                            </div>
                        </td>
                    </tr>
                `}).join('');
            } catch (e) { alert(e.message); }
        }

        window.ubahStatus = async (userId, status) => {
            if (!confirm(`Yakin ${status === 'blocked' ? 'memblokir' : 'mengaktifkan'} user ini?`)) return;
            try { await apiCall('/api/admin/users/status', 'PUT', { userId, status }); showSuccess(`Status user diubah menjadi ${status}`); await loadUsers(); } catch (e) { alert(e.message); }
        };

        window.hapusDataMember = async (userId, nama) => {
            if (!confirm(`PERINGATAN: Hapus SEMUA data koloni & keuangan milik "${nama}"? Akun mereka akan tetap ada, hanya datanya yang di-reset.`)) return;
            try { 
                await apiCall('/api/admin/users/reset', 'DELETE', { userId }); 
                showSuccess(`Data milik ${nama} berhasil dihapus permanen`); 
                await loadUsers(); 
            } catch (e) { alert(e.message); }
        };

        async function loadMessage() {
            try { const data = await apiCall('/api/admin/suspend-message'); document.getElementById('suspendMessage').value = data.message || ''; } catch (e) { console.error(e); }
        }

        document.getElementById('btnSaveMessage').onclick = async () => {
            const message = document.getElementById('suspendMessage').value;
            if (!message) return alert('Pesan tidak boleh kosong');
            try { await apiCall('/api/admin/suspend-message', 'PUT', { message }); showSuccess('Teks suspend berhasil diperbarui'); } catch (e) { alert(e.message); }
        };

        async function loadPopupSettings() {
            try {
                const data = await apiCall('/api/public/popup');
                document.getElementById('popupActive').value = data.is_active ? 'true' : 'false';
                document.getElementById('popupLink').value = data.link_url || '';
                document.getElementById('popupImageUrl').value = data.image_url || '';
                
                if (data.image_url) {
                    document.getElementById('currentImagePreview').innerHTML = `Preview: <br><img src="${data.image_url}" style="max-height: 100px; margin-top: 5px; border-radius: 4px; border: 1px solid #ddd;">`;
                } else {
                    document.getElementById('currentImagePreview').textContent = 'Belum ada gambar.';
                }
            } catch (e) { console.error(e); }
        }

        document.getElementById('btnSavePopup').onclick = async () => {
            const btn = document.getElementById('btnSavePopup');
            const imageUrl = document.getElementById('popupImageUrl').value;
            const isActive = document.getElementById('popupActive').value;
            const linkUrl = document.getElementById('popupLink').value;

            btn.textContent = 'Menyimpan...'; btn.disabled = true;

            try {
                await apiCall('/api/admin/popup', 'PUT', { is_active: isActive === 'true', image_url: imageUrl, link_url: linkUrl });
                showSuccess('Pengaturan pop-up berhasil disimpan!');
                await loadPopupSettings();
            } catch (e) { alert(e.message); } 
            finally { btn.textContent = 'Simpan Pengaturan Popup'; btn.disabled = false; }
        };

        document.getElementById('btnLogout').onclick = async () => { await fetch('/api/auth/logout', { method: 'POST' }); window.location.href = '/login.html'; };

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const me = await apiCall('/api/auth/me');
                if (!me.user || me.user.role !== 'admin') { window.location.href = '/login.html'; return; }
                await loadUsers(); await loadMessage(); await loadPopupSettings();
            } catch (e) { window.location.href = '/login.html'; }
        });
    </script>
</body>
</html>
